# Collaudo automatico sui tre sistemi veri, a ogni modifica.
# Le suite non toccano il sistema: lavorano su cartelle di prova.
name: Collaudo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Suite di collaudo (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & .\Windows\test\Collaudo.ps1
          exit $LASTEXITCODE

      # Stesso interprete per cui e' scritto lo strumento (Windows
      # PowerShell 5.1) e versione del modulo fissata: le regole cambiano
      # fra una versione e l'altra, e il risultato deve essere
      # riproducibile anche in locale.
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $r = @(Invoke-ScriptAnalyzer -Path Windows -Recurse -Severity Error, Warning `
                   -Settings Windows\PSScriptAnalyzerSettings.psd1)
          $r | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap | Out-String -Width 300
          "Segnalazioni: $($r.Count)"
          if ($r.Count -gt 0) { exit 1 }

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # /bin/bash e' la 3.2 che Apple installa: e' la versione che
      # il progetto deve supportare, non quella di Homebrew.
      - name: Suite di collaudo (bash 3.2)
        working-directory: macOS
        run: /bin/bash test/collaudo.sh

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Suite di collaudo
        working-directory: Linux Ubuntu
        run: bash test/collaudo.sh

      - name: ShellCheck
        run: git ls-files -z '*.sh' '*.command' | xargs -0 shellcheck -S warning
