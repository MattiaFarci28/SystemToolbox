# Collaudo automatico sui tre sistemi veri, a ogni modifica.
# Le suite non toccano il sistema: lavorano su cartelle di prova.
name: Collaudo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Suite di collaudo (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & .\Windows\test\Collaudo.ps1
          exit $LASTEXITCODE

      # Stesso interprete per cui e' scritto lo strumento (Windows
      # PowerShell 5.1) e versione del modulo fissata: le regole cambiano
      # fra una versione e l'altra, e il risultato deve essere
      # riproducibile anche in locale.
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $r = @(Invoke-ScriptAnalyzer -Path Windows -Recurse -Severity Error, Warning `
                   -Settings Windows\PSScriptAnalyzerSettings.psd1)
          $r | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap | Out-String -Width 300
          "Segnalazioni: $($r.Count)"
          if ($r.Count -gt 0) { exit 1 }

      # Tempi di ogni sezione dell'analisi (sola lettura), prima che
      # le operazioni vere ripuliscano la macchina. Solo informativo:
      # serve a confrontare il prima e il dopo delle ottimizzazioni.
      - name: Tempi
        shell: powershell
        continue-on-error: true
        run: |
          & .\Windows\test\Misura.ps1

      # Lo strumento vero, senza simulazione: la macchina di GitHub
      # viene buttata via dopo la prova. Lo script si rifiuta di
      # partire fuori da GitHub Actions.
      - name: Operazioni vere
        shell: powershell
        timeout-minutes: 60
        run: |
          & .\Windows\test\Reale.ps1
          exit $LASTEXITCODE

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # /bin/bash e' la 3.2 che Apple installa: e' la versione che
      # il progetto deve supportare, non quella di Homebrew.
      - name: Suite di collaudo (bash 3.2)
        working-directory: macOS
        run: /bin/bash test/collaudo.sh

      - name: Tempi
        working-directory: macOS
        continue-on-error: true
        run: /bin/bash test/misura.sh

      - name: Operazioni vere
        working-directory: macOS
        timeout-minutes: 30
        run: /bin/bash test/reale.sh

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Suite di collaudo
        working-directory: Linux Ubuntu
        run: bash test/collaudo.sh

      - name: Tempi
        working-directory: Linux Ubuntu
        continue-on-error: true
        run: bash test/misura.sh

      - name: Operazioni vere
        working-directory: Linux Ubuntu
        timeout-minutes: 30
        run: bash test/reale.sh

      - name: ShellCheck
        run: git ls-files -z '*.sh' '*.command' | xargs -0 shellcheck -S warning

  # Le stesse prove dentro container usa e getta, piu' test/distro.sh,
  # che esegue DAVVERO il gestore pacchetti di ogni distribuzione:
  # indice, elenchi, pulizia, riparazione, aggiornamento. Nel container
  # non c'e' niente da perdere, e cosi' DNF e pacman sono provati per
  # davvero e non solo scritti. Le immagini sono quelle ufficiali delle
  # distribuzioni su Docker Hub.
  distro:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    container: ${{ matrix.immagine }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Ubuntu (apt vero)
            immagine: ubuntu:24.04
            gestore: apt
            prepara: apt-get update && apt-get install -y procps iproute2 python3
          - nome: Fedora (dnf vero)
            immagine: fedora:latest
            gestore: dnf
            prepara: dnf -y install findutils gawk procps-ng iproute hostname diffutils util-linux which python3
          - nome: Arch (pacman vero)
            immagine: archlinux:latest
            gestore: pacman
            prepara: pacman -Syu --noconfirm --needed gawk findutils procps-ng iproute2 diffutils util-linux which python pacman-contrib
    steps:
      - name: Strumenti di base
        run: ${{ matrix.prepara }}

      - uses: actions/checkout@v5

      # Niente "working-directory" qui: dentro un container GitHub passa
      # la cartella a Docker senza virgolette, e lo spazio di
      # "Linux Ubuntu" la spezza ("No such container: Ubuntu").
      # Si entra nella cartella dentro il comando, tra virgolette.
      - name: Suite di collaudo
        run: cd "Linux Ubuntu" && bash test/collaudo.sh

      - name: Gestore pacchetti vero
        run: cd "Linux Ubuntu" && bash test/distro.sh ${{ matrix.gestore }}
